<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Time</title>
    <link id="favicon-link" rel="icon" type="image/png" href="Images/sun.png">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" id="theme-color-meta" content="#FFD93D">
</head>
<body class="day-mode">
    <button id="mode-toggle-btn">🌙</button>

    <div class="nav-buttons">
        <button id="clock-nav-btn" class="nav-btn active">Clock</button>
        <button id="timer-nav-btn" class="nav-btn">Timer</button>
    </div>

    <div id="clock-screen" class="screen">
        <p id="clock-display">00:00:00</p>
    </div>

    <div id="timer-screen" class="screen hide">
        <p id="timer-display">00:00</p>
        <input type="number" id="timer-minutes-input" min="0" placeholder="Minutes">
        <div class="timer-buttons">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
